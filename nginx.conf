events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name appointments.moa.gov.et 196.189.237.3;

        # 1. ADMIN DASHBOARD (Priority)
        # This handles /admin, /admin/dashboard, and ALL assets like /admin/_next/
        location ^~ /admin {
            set $upstream_admin amm_admin_dashboard;
            # NO trailing slash here ensures the app sees the /admin prefix it expects
            proxy_pass http://$upstream_admin:3001; 
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. BACKEND API (Priority)
        location ^~ /api {
            set $upstream_api amm_backend;
            proxy_pass http://$upstream_api:3002;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. PUBLIC WEB (Catch-all)
        location / {
            set $upstream_web amm_public_web;
            proxy_pass http://$upstream_web:3000;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }
    }
}
