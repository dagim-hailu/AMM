version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15-alpine
    container_name: amm_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: amm_db
    ports:
      - "5433:5432"
    volumes:
      - amm_postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - amm-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Message Broker
  redis:
    image: redis:7-alpine
    container_name: amm_redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - amm-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (NestJS)
  backend:
    build:
      context: .
      dockerfile: apps/backend-api/Dockerfile
    container_name: amm_backend
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:password@amm_postgres:5432/amm_db
      - REDIS_URL=redis://amm_redis:6379
      - PORT=3002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - amm-network

  # Public Web App (Next.js)
  public-web:
    build:
      context: .
      dockerfile: apps/public-web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://196.189.237.3:8080/api
    container_name: amm_public_web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://196.189.237.3:8080/api
      - PORT=3000
    depends_on:
      - backend
    restart: always
    networks:
      - amm-network

  # Admin Dashboard (Next.js)
  admin-dashboard:
    build:
      context: .
      dockerfile: apps/admin-dashboard/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://196.189.237.3:8080/api
    container_name: amm_admin_dashboard
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://196.189.237.3:8080/api
      - PORT=3001
    depends_on:
      - backend
    restart: always
    networks:
      - amm-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: amm_nginx
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - public-web
      - admin-dashboard
      - backend
    restart: always
    networks:
      - amm-network

volumes:
  amm_postgres_data:

# Explicitly define the network so Nginx can resolve the container names
networks:
  amm-network:
    driver: bridge
