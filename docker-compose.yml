version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15-alpine
    container_name: amm_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: amm_db
    ports:
      - "5433:5432"
    volumes:
      - amm_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Message Broker
  redis:
    image: redis:7-alpine
    container_name: amm_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (NestJS)
  backend:
    build:
      context: ./apps/backend-api
      dockerfile: Dockerfile
    container_name: amm_backend
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/amm_db
      - REDIS_URL=redis://redis:6379
      - PORT=3002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./apps/backend-api:/app
      - /app/node_modules

  # Public Web App (Next.js)
  public-web:
    build:
      context: ./apps/public-web
      dockerfile: Dockerfile
    container_name: amm_public_web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:3002
      - PORT=3000
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      - ./apps/public-web:/app
      - /app/node_modules

  # Admin Dashboard (Next.js)
  admin-dashboard:
    build:
      context: ./apps/admin-dashboard
      dockerfile: Dockerfile
    container_name: amm_admin_dashboard
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:3002
      - PORT=3001
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      - ./apps/admin-dashboard:/app
      - /app/node_modules

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: amm_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - public-web
      - admin-dashboard
      - backend
    restart: unless-stopped

volumes:
  amm_postgres_data: